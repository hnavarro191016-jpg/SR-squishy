<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5B84" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded rect like iOS / Android App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#appBg)" />

  <!-- Subtle glow ring -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6" />

  <!-- Main Squishy Bear Body -->
  <g filter="url(#shadow)">
    <!-- Ears -->
    <circle cx="160" cy="170" r="50" fill="#FFA5BA" />
    <circle cx="160" cy="170" r="28" fill="#F43F5E" />

    <circle cx="352" cy="170" r="50" fill="#FFA5BA" />
    <circle cx="352" cy="170" r="28" fill="#F43F5E" />

    <!-- Head / Body -->
    <ellipse cx="256" cy="275" rx="145" ry="135" fill="url(#faceGrad)" />

    <!-- Cute Eyes -->
    <ellipse cx="205" cy="265" rx="14" ry="18" fill="#1E293B" />
    <circle cx="210" cy="258" r="5" fill="#FFFFFF" />

    <ellipse cx="307" cy="265" rx="14" ry="18" fill="#1E293B" />
    <circle cx="312" cy="258" r="5" fill="#FFFFFF" />

    <!-- Cheeks Blush -->
    <circle cx="170" cy="295" r="18" fill="#FDA4AF" opacity="0.8" />
    <circle cx="342" cy="295" r="18" fill="#FDA4AF" opacity="0.8" />

    <!-- Snout / Nose -->
    <ellipse cx="256" cy="290" rx="32" ry="24" fill="#FFE4E6" />
    <ellipse cx="256" cy="282" rx="12" ry="8" fill="#BE123C" />
    <!-- Smile -->
    <path d="M 248 294 Q 256 304 264 294" stroke="#BE123C" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Sparkle Stars -->
    <path d="M 380 120 L 385 135 L 400 140 L 385 145 L 380 160 L 375 145 L 360 140 L 375 135 Z" fill="#FDE047" />
    <path d="M 125 125 L 128 135 L 138 138 L 128 141 L 125 151 L 122 141 L 112 138 L 122 135 Z" fill="#FDE047" />
  </g>
</svg>
